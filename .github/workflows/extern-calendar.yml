name: Extern Calendar Refresh

# Once daily. Extern's projections update ~monthly, and the hourly
# Simplify watcher (simplify-watch.yml) now carries the live-posting
# signal, so a second daily Extern pass bought nothing - its Actions
# minutes went to the hourly watcher instead. Live career-site checks
# are check-intern-postings.yml's job.
on:
  schedule:
    # UTC mapped to Eastern (EDT, UTC-4): shift by 1h after DST ends
    # for exact alignment, same caveat as check-intern-postings.yml.
    - cron: "0 13 * * *"   # ~9:00 AM ET
  workflow_dispatch: {}

concurrency:
  group: extern-calendar
  cancel-in-progress: false

permissions:
  contents: write   # commits the refreshed calendar + spreadsheet

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only openpyxl is needed - no playwright/browsers, keeps the run fast.
      - name: Install dependencies
        run: pip install openpyxl

      - name: Run tests
        run: python -m unittest tests.test_extern_watch

      - name: Refresh calendar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python extern_watch.py

      - name: Commit updated calendar
        run: |
          git config user.name "intern-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add extern_calendar.json InternWatch.xlsx
          if ! git diff --staged --quiet; then
            git commit -m "Refresh Extern calendar [skip ci]"
            # Concurrent workflows push to main too (they touch different
            # files, so rebase is always clean) - retry the race.
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi
