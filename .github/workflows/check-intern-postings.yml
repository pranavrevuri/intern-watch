name: Check Intern Postings

on:
  schedule:
    # UTC times mapped to Eastern (EDT, UTC-4, roughly mid-Mar to
    # early Nov - shift by 1h after DST ends for exact alignment).
    # Two tiers: the BASE tier always runs and fits the private-repo
    # free minutes; the MAX tier only runs when the repo is PUBLIC
    # (unlimited Actions minutes) - the job-level `if` skips it on a
    # private repo at zero cost, so going public upgrades the cadence
    # automatically with no other change.
    #   full sweep = browser + ATS (~20 min); fast lane = HTTP-only
    #   ATS sources (~3 min, no browser).
    - cron: "0 13 * * *"                # BASE: full sweep ~9:00 AM ET
    - cron: "0 15,17,19,21,23,1 * * *"  # BASE: fast lane every 2h
    - cron: "0 19,3 * * *"              # MAX: extra full sweeps ~3PM/11PM ET
    - cron: "20,40 * * * *"             # MAX: fast lane every 20 min, 24/7
  workflow_dispatch: {}   # manual runs are always a full sweep

env:
  MONITOR_FAST: ${{ github.event_name == 'schedule' && github.event.schedule != '0 13 * * *' && github.event.schedule != '0 19,3 * * *' && '1' || '' }}

concurrency:
  group: intern-watch
  cancel-in-progress: false

permissions:
  contents: write   # so the workflow can commit the updated state.json

jobs:
  check:
    # MAX-tier schedules only run on a public repo (free unlimited
    # minutes); skipped jobs cost nothing on private.
    if: >-
      github.event_name != 'schedule' ||
      (github.event.schedule != '0 19,3 * * *' && github.event.schedule != '20,40 * * * *') ||
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fast-lane runs are stdlib-only: no pip, no browser, no tests.
      - name: Install dependencies
        if: env.MONITOR_FAST != '1'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests
        if: env.MONITOR_FAST != '1'
        run: python -m unittest discover tests

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "intern-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git pull --rebase origin main || true
            git commit -m "Update seen postings [skip ci]"
            git push
          fi
