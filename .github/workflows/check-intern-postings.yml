name: Check Intern Postings

on:
  schedule:
    # UTC times mapped to Eastern (EDT, UTC-4, roughly mid-Mar to
    # early Nov - shift by 1h after DST ends for exact alignment).
    # One FULL sweep a day (browser + ATS, ~20 min), then a FAST lane
    # (HTTP-only ATS sources, ~3 min, no browser) every 2 hours through
    # the day so ATS-hosted postings alert within hours of going live.
    - cron: "0 13 * * *"                # full sweep ~9:00 AM ET
    - cron: "0 15,17,19,21,23,1 * * *"  # fast lane, ~11AM-9PM ET
  workflow_dispatch: {}   # manual runs are always a full sweep

env:
  MONITOR_FAST: ${{ github.event_name == 'schedule' && github.event.schedule != '0 13 * * *' && '1' || '' }}

concurrency:
  group: intern-watch
  cancel-in-progress: false

permissions:
  contents: write   # so the workflow can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fast-lane runs are stdlib-only: no pip, no browser, no tests.
      - name: Install dependencies
        if: env.MONITOR_FAST != '1'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests
        if: env.MONITOR_FAST != '1'
        run: python -m unittest discover tests

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "intern-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git pull --rebase origin main || true
            git commit -m "Update seen postings [skip ci]"
            git push
          fi
