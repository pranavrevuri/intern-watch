name: Check Intern Postings

on:
  schedule:
    # UTC times mapped to Eastern (EDT, UTC-4, roughly mid-Mar to
    # early Nov - shift by 1h after DST ends for exact alignment).
    - cron: "0 4 * * *"    # ~midnight ET
    - cron: "0 13 * * *"   # ~9:00 AM ET
    - cron: "0 21 * * *"   # ~5:00 PM ET
  workflow_dispatch: {}   # manual "Run workflow" button for testing

# Prevent overlapping runs: if a scheduled run starts while another is
# still going (or you trigger one manually mid-run), it queues instead
# of racing on state.json.
concurrency:
  group: intern-watch
  cancel-in-progress: false

permissions:
  contents: write   # so the workflow can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests
        run: python -m unittest discover tests

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "intern-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git pull --rebase origin main || true
            git commit -m "Update seen postings [skip ci]"
            git push
          fi
