name: Simplify Live Watch

# Every 2 hours, offset from the monitor fast lane so between the two
# something checks for new postings roughly hourly. One HTTP fetch per
# run, ~1 billable minute; :17 dodges top-of-hour scheduler congestion.
on:
  schedule:
    - cron: "17 */2 * * *"   # BASE: every 2h (fits private-repo minutes)
    - cron: "47 * * * *"     # MAX: the in-between half-hours, public repo only
  workflow_dispatch: {}

concurrency:
  group: simplify-watch
  cancel-in-progress: false

permissions:
  contents: write   # commits simplify_state.json

jobs:
  check:
    if: >-
      github.event_name != 'schedule' ||
      github.event.schedule != '47 * * * *' ||
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No setup-python / pip: stdlib only, the runner's python3 is fine.
      - name: Run tests
        run: python3 -m unittest tests.test_simplify_watch

      - name: Check for new postings
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 simplify_watch.py

      - name: Check underclassman sources
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 underclass_watch.py

      - name: Commit updated state
        run: |
          git config user.name "intern-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add simplify_state.json underclass_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Update Simplify seen postings [skip ci]"
            # Concurrent workflows push to main too (they touch different
            # files, so rebase is always clean) - retry the race.
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi
